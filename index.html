    <script type="application/ld+json">

      },

      },
      "featureList": [
        "Calendário offline",
        "Criação de eventos",
        "Arrastar e redimensionar",
        "Recorrência de eventos",
        "Lembretes in-app",
        "Importação ICS",
        "Backup e restauração",

      ],
      "screenshot": "https://calendario-pessoal-ruby.vercel.app/og-image.png",

    </script>
    
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "O que é o WebCal?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "O WebCal é um calendário e agenda online 100% offline. Seus eventos ficam armazenados diretamente no seu navegador, sem precisar de servidor ou conta. É um planner digital privado, rápido e gratuito."
          }
        },
        {
          "@type": "Question",
          "name": "Como funciona o calendário offline?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "O WebCal usa armazenamento local (IndexedDB) para salvar seus eventos. Tudo acontece no seu dispositivo — sem sincronização na nuvem, sem cadastro. Basta abrir o site e começar a usar."
          }
        },
        {
          "@type": "Question",
          "name": "Posso usar como agenda online compartilhada?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "O WebCal é focado em uso individual e privado. Para compartilhar eventos, você pode exportar um arquivo de backup ou importar/exportar eventos no formato padrão ICS."
          }
        },
        {
          "@type": "Question",
          "name": "O WebCal funciona no celular?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sim! O WebCal é responsivo e funciona bem em qualquer dispositivo. Além disso, é uma PWA, então você pode instalá-lo na tela inicial como um app."
          }
        },
        {
          "@type": "Question",
          "name": "É seguro usar o WebCal para compromissos pessoais?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sim. O WebCal não envia seus dados para nenhum servidor. Tudo fica salvo no seu navegador. Nenhum terceiro tem acesso às suas informações."
          }
        },
        {
          "@type": "Question",
          "name": "Posso importar eventos de outros calendários?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sim! O WebCal suporta importação de arquivos ICS (formato padrão do Google Agenda, Apple Calendar e outros). Você também pode fazer backup e restauração do banco de dados completo."
          }
        },
        {
          "@type": "Question",
          "name": "O que diferencia o WebCal de um calendário tradicional?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Diferente do Google Agenda ou Outlook, o WebCal não depende de internet, não coleta dados e não precisa de conta. É um organizador pessoal offline que respeita sua privacidade."
          }
        },
        {
          "@type": "Question",
          "name": "Quais funcionalidades o WebCal oferece?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "O WebCal inclui: criação e edição de eventos, arrastar e redimensionar, recorrência, busca por texto, filtro por categoria, lembretes in-app, importação ICS, backup/restore, visualização mensal, semanal e diária — tudo em português."
          }
        }
      ]
    }
    </script>
